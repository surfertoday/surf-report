name: Update NOAA station inventory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build station inventory
        run: python scripts/build_noaa_inventory.py
      - name: Commit inventory if changed
        run: |
          if git diff --quiet -- site/data/stations.json; then
            echo "Station inventory unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/stations.json
          git commit -m "Update NOAA station inventory"
          git push
